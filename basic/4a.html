<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buttons/title>
    <style>
      .yellow-button {
        background-color: yellow;
        color: black;
        border: 3px solid black;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      .orange-button {
        background-color: orange;
        color: black;
        border: 3px solid black;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button>click</button>

    <br />
    <button>Aditya</button>

    <button>Parantha</button>

    <p>Hello world!</p>
    <p>i did what i needed to do</p>

    <button class="yellow-button">Add to cart</button>
    <button class="orange-button">Buy now</button>

    <script>
      console.log("Welcome!");
    </script>
  </body>
</html>
