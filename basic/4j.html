<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Behavior</title>
    <style>
      .yellow-button {
        background-color: yellow;
        color: black;
        border: 2px solid black;
      }

      .orange-button {
        background-color: orange;
        color: black;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <p>Adutls Plain Cotton Cloth</p>
    <p>Price: $7.99</p>
    <button class="yellow-button" onclick="alert('added')">Add to cart</button>
    <button
      class="orange-button"
      onclick="console.log('loading'); alert('purchased')"
    >
      Buy now
    </button>
  </body>
</html>
