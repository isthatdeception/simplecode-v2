<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <h1>Calculator</h1>
    <p>
      <button
        onclick="calculation += '1'; console.log(`operation: ${calculation}`)"
      >
        1
      </button>
      <button
        onclick="calculation += '2'; console.log(`operation: ${calculation}`)"
      >
        2
      </button>
      <button
        onclick="calculation += '3'; console.log(`operation: ${calculation}`)"
      >
        3
      </button>
    </p>
    <p>
      <button
        onclick="calculation += '4'; console.log(`operation: ${calculation}`)"
      >
        4
      </button>
      <button
        onclick="calculation += '5'; console.log(`operation: ${calculation}`)"
      >
        5
      </button>
      <button
        onclick="calculation += '6'; console.log(`operation: ${calculation}`)"
      >
        6
      </button>
    </p>
    <p>
      <button
        onclick="calculation += '7'; console.log(`operation: ${calculation}`)"
      >
        7
      </button>
      <button
        onclick="calculation += '8'; console.log(`operation: ${calculation}`)"
      >
        8
      </button>
      <button
        onclick="calculation += '9'; console.log(`operation: ${calculation}`)"
      >
        9
      </button>
    </p>
    <p>
      <button
        onclick="calculation += '0'; console.log(`operation: ${calculation}`)"
      >
        0
      </button>

      <!-- reset button -->
      <button onclick="calculation = ''; console.log('calculation was reset')">
        C
      </button>
    </p>

    <!-- operation -->
    <p>
      <button
        onclick="calculation += ' + '; console.log(`operation: ${calculation}`) "
      >
        +
      </button>
      <button
        onclick="calculation += ' - '; console.log(`operation: ${calculation}`)"
      >
        -
      </button>
    </p>
    <p>
      <button
        onclick="calculation += ' * '; console.log(`operation: ${calculation}`)"
      >
        *
      </button>
      <button
        onclick="calculation += ' / '; console.log(`operation: ${calculation}`)"
      >
        /
      </button>
    </p>

    <button
      onclick="calculation = eval(calculation); console.log(`calculation: ${calculation}`)"
    >
      =
    </button>

    <script>
      let calculation = "";
    </script>
  </body>
</html>
